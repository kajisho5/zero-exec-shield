# ZES regression tests. External Actions are pinned to a commit SHA (tags can be rewritten).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: strace（ゼロ実行検証に必須。無いと SKIP になり合格扱いにしない）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq strace
      - name: shellcheck
        run: shellcheck -S warning -e SC2088,SC2066 zes-scan.sh tests/*.sh
      - name: 版の一致（CHANGELOG の先頭 = ZES_VERSION = ui/package.json）
        run: tests/check-versions.sh
      - name: run-tests
        run: tests/run-tests.sh
      - name: zero-exec
        run: tests/zero-exec.sh
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Run in the official image that includes the browsers and OS-dependent packages (same version as @playwright/test, pinned by digest).
    # With a slow apt mirror, playwright install --with-deps alone took 10-40 minutes and the job timed out
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --user 1001
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: npm ci（ui/.npmrc で ignore-scripts=true）
        run: npm ci
      - name: unit tests
        run: npm test
      # Save the committed index.html before the build and compare with cmp, so the comparison works even without git in the container
      - name: build（型検査・単一ファイル化・外部通信なしの静的検査を含む）
        run: cp ../index.html "$RUNNER_TEMP/index.committed.html" && npm run build
      - name: コミット済みの index.html がソースから再現できること
        run: cmp "$RUNNER_TEMP/index.committed.html" ../index.html
      - name: Playwright の版がコンテナのイメージと一致すること
        run: test "$(node -p "require('@playwright/test/package.json').version")" = "1.56.1"
      - name: e2e（Chromium / Firefox / WebKit）
        timeout-minutes: 20
        run: npm run test:e2e
        env:
          E2E_ALL_BROWSERS: '1'
      - name: 失敗時の trace（ファイル内容は含まない、フィクスチャのみ）
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: ui/test-results/
          retention-days: 7
