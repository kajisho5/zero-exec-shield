# If there is no tag vX.Y.Z for the first version in CHANGELOG.md on main ("## X.Y.Z — YYYY-MM-DD"),
# create the tag and a GitHub Release. The release notes are the section of that version in CHANGELOG. No external Actions are used (gh is standard on the runner).
name: release
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CHANGELOG から版とリリースノートを取り出す
        id: ver
        run: |
          # Fail if the first "## " heading is not a version ("## Unreleased" etc.). Never silently fall back to an older version below
          line="$(grep -m1 -E '^## ' CHANGELOG.md || true)"
          ver="$(printf '%s\n' "$line" | sed -n -E 's/^## ([0-9]+\.[0-9]+\.[0-9]+)( — [0-9]{4}-[0-9]{2}-[0-9]{2})?$/\1/p')"
          if [ -z "$ver" ]; then echo "::error file=CHANGELOG.md::先頭の見出しが \"## X.Y.Z — YYYY-MM-DD\" ではありません: ${line:-（見出しなし）}"; exit 1; fi
          # From the line after the heading of that version up to just before the next "## " heading
          awk -v v="$ver" 'BEGIN{p=0} /^## /{ if (p) exit; if (index($0, "## " v " ")==1) {p=1; next} } p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - name: タグと Release を作成（既にあれば何もしない）
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          if gh release view "v$VER" >/dev/null 2>&1; then echo "v$VER は作成済み"; exit 0; fi
          gh release create "v$VER" --target "$GITHUB_SHA" --title "v$VER" --notes-file "$RUNNER_TEMP/notes.md"
